[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrec"
version = "0.1.0"
description = "Harness-agnostic flight recorder for AI coding agents: record, replay, scrub and fork any agent session."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cedric Brzyski" }]
dependencies = [
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flightrec = "flightrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
